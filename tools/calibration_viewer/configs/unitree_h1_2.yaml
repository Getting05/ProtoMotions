format_version: 2
human:
  format: smpl_pkl
  axes: [z, x, y]
robot:
  format: urdf
  model: unitree_h1_2_27dof
  base_link: pelvis
  # Resolved relative to the URDF directory. This matches ProtoMotions' layout.
  mesh_dir: ../../mesh/H1_2
  keypoint_links:
    pelvis: pelvis
    left_hip: left_hip_yaw_link
    right_hip: right_hip_yaw_link
    left_knee: left_knee_link
    right_knee: right_knee_link
    left_ankle: left_ankle_roll_link
    right_ankle: right_ankle_roll_link
    left_foot: left_foot_link
    right_foot: right_foot_link
    left_shoulder: left_shoulder_roll_link
    right_shoulder: right_shoulder_roll_link
    left_elbow: left_elbow_link
    right_elbow: right_elbow_link
    left_wrist: left_wrist_yaw_link
    right_wrist: right_wrist_yaw_link
  t_pose_joint_positions:
    left_shoulder_roll_joint: 1.5708
    right_shoulder_roll_joint: -1.5708
    left_elbow_joint: 1.5708
    right_elbow_joint: 1.5708

calibration:
  mode: bone
  bone_scales: {torso: 1.0, upper_arm: 1.0, forearm: 1.0, thigh: 1.0, shank: 1.0}
  joint_offsets: {shoulder: [0.0, 0.0, 0.0], elbow: [0.0, 0.0, 0.0], hip: [0.0, 0.0, 0.0]}
